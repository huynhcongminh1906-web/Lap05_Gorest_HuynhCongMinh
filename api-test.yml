name: API Test (CI)

on: push

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Newman
        run: npm install -g newman
      - name: Run GoRest collection (Data-Driven)
        run: |
          newman run GoRest.postman_collection.json \
            -e GoRest.postman_environment.json \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
